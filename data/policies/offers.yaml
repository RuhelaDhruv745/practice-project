# Approved offers. Eligibility (segment, tenure, expiry, channel) is checked in code.
# Descriptions avoid numbers so the only number in an offer is its value.
version: "1.0"

offers:
  - offer_id: LOYAL-10GB
    description: bonus data added to your current plan
    value: 10
    unit: gb
    expiry: 2027-01-31
