# Baseline CI (architect). Owned by Member 5 after the baseline merges.
# Uses no secrets: tests mock the LLM and must not need an API key.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            **/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pytest
        env:
          LLM_PROVIDER: mock
        run: python -m pytest -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    # hashFiles() is not available in a job-level `if`, so the guard is per step:
    # until Member 4 creates frontend/package.json, this job only checks out and skips.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: hashFiles('frontend/package.json') != ''
        run: npm ci
      - if: hashFiles('frontend/package.json') != ''
        run: npm run lint
      - if: hashFiles('frontend/package.json') != ''
        run: npm test -- --run
      - if: hashFiles('frontend/package.json') != ''
        run: npm run build
