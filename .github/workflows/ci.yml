# Baseline CI (architect). Owned by Member 5 after the baseline merges.
# Uses no secrets: tests mock the LLM and must not need an API key.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            **/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pytest
        env:
          LLM_PROVIDER: mock
        run: python -m pytest -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    # hashFiles() is not available in a job-level `if`, so the guard is per step:
    # until Member 4 creates frontend/package.json, this job only checks out and skips.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: hashFiles('frontend/package.json') != ''
        run: npm ci
      - if: hashFiles('frontend/package.json') != ''
        run: npm run lint
      - if: hashFiles('frontend/package.json') != ''
        run: npm test -- --run
      - if: hashFiles('frontend/package.json') != ''
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: python
    # No registry login, no push, no secrets: images are built and run locally on the
    # runner with LLM_PROVIDER=mock, then removed.
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build backend and reviewer_ui images
        run: docker compose build backend reviewer_ui

      - name: Start stack and wait for health checks
        env:
          LLM_PROVIDER: mock
        run: docker compose up -d --wait --wait-timeout 180 backend reviewer_ui

      - name: Smoke test
        env:
          # TODO(integration): set to "1" once backend/app/main.py wires the real
          # PolicyEngine; until then /api/customers returns 500 (NotWiredError).
          SMOKE_STRICT: "0"
        run: sh scripts/docker_smoke.sh http://localhost:8000 http://localhost:8501

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Build frontend image (once frontend/ exists)
        if: hashFiles('frontend/package.json') != ''
        run: docker compose --profile frontend build frontend

      - name: Stop stack
        if: always()
        run: docker compose down
